# fly.toml app configuration file generated for statline on 2026-06-04T01:27:32-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'statline'
primary_region = 'dfw'

[build]

[env]
  STATLINE_DB_PATH = '/data/statline.db'

[[mounts]]
  source = 'statline_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
